# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: P-digit 개발 기록
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  prefetch: viewport
  analytics: null
  locale: ko-KR
  baseUrl: p-digit.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # 본문·제목은 Pretendard(CDN, plugins/post-extras 의 stylesheets 옵션 → custom.scss :root)가
      # 먼저 쓰이고, 여기 Noto Sans KR 은 CDN 실패 때의 대체 글꼴이다. 쓰이지 않으면 내려받지 않는다.
      header: Noto Sans KR
      body: Noto Sans KR
      code: JetBrains Mono
    # A안 "Precision Tech" (DESIGN_SPEC §2): 쿨 슬레이트 + 로열 블루
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e2e8f0"
        gray: "#94a3b8"
        darkgray: "#334155"
        dark: "#0f172a"
        secondary: "#2563eb"
        tertiary: "#0d9488"
        highlight: rgba(37, 99, 235, 0.08)
        textHighlight: "#fef08a99"
      darkMode:
        light: "#0b0f17"
        lightgray: "#1e293b"
        gray: "#64748b"
        darkgray: "#cbd5e1"
        dark: "#f8fafc"
        secondary: "#60a5fa"
        tertiary: "#2dd4bf"
        highlight: rgba(96, 165, 250, 0.14)
        textHighlight: "#ca8a0466"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "./plugins/post-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "./plugins/site-footer"
    enabled: true
    options:
      author: P-digit
      links:
        GitHub: https://github.com/P-digit
    layout:
      position: footer
      priority: 50
  - source: "./plugins/post-extras"
    enabled: true
    options:
      # 본문 글꼴 Pretendard Variable (필요한 글자만 나눠 받는 dynamic subset)
      stylesheets:
        - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
    order: 50
    layout:
      position: afterBody
      priority: 1
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: Tokyo Night
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # 범주 폴더는 정해진 순서(DESIGN_SPEC §1.1), 나머지는 기본 규칙(폴더 먼저, 가나다·숫자순)
      sortFn: |-
        (a, b) => {
          const order = ["robotics", "algorithm", "embedded", "dev", "retro"];
          const ia = order.indexOf(a.slugSegment), ib = order.indexOf(b.slugSegment);
          if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
          return (a.displayName || "").localeCompare(b.displayName || "", undefined, { numeric: true, sensitivity: "base" });
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # ko-KR 번역이 "N min read" 영문이라 끄고 ./plugins/post-meta 로 대체
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: 홈
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # ko-KR 번역이 "Created with" 영문이라 끄고 ./plugins/site-footer 로 대체
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links:
        GitHub: https://github.com/P-digit
    layout:
      position: footer
      priority: 50
  # 첫 화면 태그 칩 (많이 쓰인 순, 노션 원래 이름). 최근 글(priority 5) 위
  - source: "./plugins/home-tags"
    enabled: true
    options:
      limit: 12
    layout:
      position: afterBody
      priority: 3
      condition: is-index
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 최근 글
      limit: 5
      showTags: true
      linkToMore: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 5
      condition: is-index
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
